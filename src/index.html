  <script>
    // Applies the stored theme before Angular boots, so reloading in light mode
    // never flashes the dark palette. Storage key must match ThemeService.
    try {
      var stored = localStorage.getItem('portfolio-theme');
      document.documentElement.setAttribute('data-theme', stored === 'light' ? 'light' : 'dark');
    } catch (e) {}
  </script>
